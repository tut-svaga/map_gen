name: CI

on:
  push:
    branches: [ "dev" , "master" ]
  pull_request:
    branches: [ "dev" , "master" ]

jobs:
  lint_and_test:
    runs-on: ubuntu-24.04

    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: root_password
      DB_NAME: test_db
      DB_PORT: 3306

    services:
      mysql-service:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: clone repo
        uses: actions/checkout@v5

      - name: install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: requirements
        run: npm ci

      - name: lint
        run: npm run lint

      - name: test
        run: npm test
  build_and_push:
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    if: github.ref == 'refs/heads/master'
    needs: lint_and_test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [ frontend, backend ]
    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: Login in GHCP
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/roadmap-${{ matrix.service }}:latest \
            -t ${{ env.REGISTRY }}/roadmap-${{ matrix.service }}:sha-${{ github.sha }} \
            ./${{ matrix.service }}
      - name: Push Docker Images
        run: |
          docker push ${{ env.REGISTRY }}/roadmap-${{ matrix.service }}:latest 
          docker push ${{ env.REGISTRY }}/roadmap-${{ matrix.service }}:sha-${{ github.sha }}