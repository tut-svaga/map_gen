<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roadmap Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header>
      <div class="theme-row">
        <h1 id="theme-name">Roadmap</h1>
        <!-- Показывается только если тем больше одной -->
        <select id="theme-select" hidden></select>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <span class="progress-label" id="progress-label">0%</span>
      </div>
    </header>

    <section class="current-step" id="current-step-card">
      <p class="loading">Загрузка…</p>
    </section>

    <details class="all-steps">
      <summary>Все шаги</summary>
      <ol id="steps-list"></ol>
    </details>

    <details class="form-block">
      <summary>Добавить шаг</summary>
      <form id="add-step-form">
        <input type="text" name="title" placeholder="Заголовок *" required />
        <textarea name="description" placeholder="Описание" rows="3"></textarea>
        <input type="url" name="resource_url" placeholder="Ссылка на материал (https://…)" />
        <button type="submit">Добавить</button>
      </form>
    </details>

    <details class="form-block">
      <summary>Создать тему</summary>
      <form id="create-theme-form">
        <input type="text" name="name" placeholder="Название темы *" required />
        <button type="submit">Создать</button>
      </form>
    </details>
  </main>

  <script src="script.js"></script>
</body>
</html>
