# Заголовки безопасности отдельным файлом, потому что add_header не
# складывается по уровням: как только в location появляется хоть один свой
# add_header, все унаследованные от server пропадают. Поэтому сниппет
# подключается в каждый location, где есть собственные заголовки.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Приложение самодостаточно: ни внешних скриптов, ни шрифтов, ни картинок
# с других хостов. Поэтому CSP можно держать жёсткой.
# 'unsafe-inline' для стилей нужен из-за инлайновых style у анимаций.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
